<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>최영숙의 올드팝 다이어리</title>
<meta property="og:title" content="최영숙의 올드팝 다이어리">
<meta property="og:description" content="최영숙님이 손수 선별하신 인생의 올드팝 188곡.">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#000;
    --bg-elev:#1c1c1e;
    --bg-elev-2:#2c2c2e;
    --bg-elev-3:#3a3a3c;
    --line:rgba(255,255,255,.1);
    --accent:#fc3c44;
    --accent-soft:#ff6b71;
    --accent-deep:#d0252d;
    --ink:#fff;
    --ink-soft:rgba(235,235,245,.78);
    --ink-mute:rgba(235,235,245,.48);
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px;-webkit-text-size-adjust:100%}
  @media (min-width:768px){html{font-size:17px}}
  @media (min-width:1024px){html{font-size:18px}}
  body{
    margin:0;padding:0;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    min-height:100vh;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    padding-bottom:var(--safe-bot);overflow-x:hidden;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  @media (min-width:768px){.wrap{padding:0 24px}}

  .hero{position:relative;padding-top:var(--safe-top);overflow:hidden;background:#000}
  .hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
  .hero-bg-grid{
    position:absolute;inset:-20px;
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,1fr);
    gap:3px;opacity:.5;filter:blur(24px) saturate(1.6);transform:scale(1.15);
  }
  .hero-bg-grid .tile{width:100%;height:100%;background-size:cover;background-position:center}
  .hero-overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.95) 88%,#000 100%);
  }
  .hero-content{position:relative;z-index:2;padding:32px 20px 28px;max-width:560px;margin:0 auto}
  @media (min-width:768px){.hero-content{padding:64px 24px 44px}}
  .hero-eyebrow{
    display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:12px;
    padding:5px 11px;background:rgba(252,60,68,.14);border-radius:6px;
  }
  .hero h1{
    font-size:clamp(1.85rem,7.5vw,2.8rem);font-weight:800;
    margin:0 0 12px;letter-spacing:-.028em;line-height:1.1;color:#fff;
  }
  .hero-tagline{
    color:var(--ink-soft);font-size:clamp(.98rem,3.6vw,1.1rem);
    margin:0 0 16px;line-height:1.5;font-weight:400;max-width:520px;
  }
  .hero-stats{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 13px;background:rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-radius:999px;font-size:.82rem;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;margin-bottom:18px;
  }
  .hero-stats b{color:#fff;font-weight:700}
  .hero-stats .dot{width:3px;height:3px;background:var(--ink-mute);border-radius:50%}

  .hero-actions{display:flex;gap:10px;margin-top:6px}
  .hero-btn{
    flex:1;padding:14px 16px;border:none;border-radius:14px;
    font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:52px;-webkit-appearance:none;letter-spacing:-.01em;
    transition:transform .12s,background .15s;
  }
  .hero-btn:active{transform:scale(.97)}
  .hero-btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(252,60,68,.35)}
  .hero-btn-primary:hover{background:var(--accent-deep)}
  .hero-btn-ghost{
    background:rgba(255,255,255,.14);color:#fff;
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  }
  .hero-btn-ghost:hover{background:rgba(255,255,255,.22)}

  .guide{margin:8px 16px 0;padding:14px 16px;background:var(--bg-elev);border-radius:14px}
  @media (min-width:768px){.guide{max-width:560px;margin:8px auto 0;padding:18px 20px}}
  .guide-title{font-size:.88rem;font-weight:700;color:var(--accent);margin:0 0 10px}
  .guide-steps{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
  .guide-steps li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--ink-soft);line-height:1.45}
  .step-num{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;
    font-weight:700;font-size:.74rem;margin-top:1px;
  }
  .guide-steps b{color:#fff;font-weight:600}

  .toolbar{
    position:sticky;top:0;z-index:50;
    background:rgba(0,0,0,.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);padding:10px 16px 8px;margin-top:16px;
  }
  .toolbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .search{position:relative}
  .search input{
    width:100%;padding:12px 14px 12px 40px;border:none;
    background:var(--bg-elev-2);border-radius:10px;
    font-family:inherit;font-size:1rem;color:#fff;outline:none;min-height:44px;
    -webkit-appearance:none;
  }
  .search input::placeholder{color:var(--ink-mute)}
  .search input:focus{background:var(--bg-elev-3);box-shadow:0 0 0 2px var(--accent)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-mute);pointer-events:none}

  .chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:7px 14px;border:none;
    background:var(--bg-elev);border-radius:999px;
    font-family:inherit;font-size:.85rem;font-weight:600;
    color:var(--ink-soft);cursor:pointer;min-height:34px;-webkit-appearance:none;
  }
  .chip.active{background:var(--accent);color:#fff}

  .count-row{display:flex;margin:18px 0 12px;padding:0 4px}
  .count{font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .count b{color:#fff;font-size:.95rem;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 0 120px}
  @media (min-width:768px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
  @media (min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (min-width:1280px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

  .card{
    background:transparent;border:none;cursor:pointer;text-align:left;padding:0;min-width:0;
    font-family:inherit;color:#fff;transition:transform .15s;
    display:flex;flex-direction:column;gap:8px;-webkit-appearance:none;
  }
  .card:active{transform:scale(.96)}
  .card-thumb{
    width:100%;aspect-ratio:1;
    background:linear-gradient(135deg,var(--bg-elev-2),var(--bg-elev));
    border-radius:10px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.35);
  }
  @media (min-width:768px){.card-thumb{border-radius:14px}}
  .card-thumb img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;background:var(--bg-elev-2);transition:transform .25s}
  .card:hover .card-thumb img{transform:scale(1.04)}
  .card-thumb .ph{color:#fff;font-size:.82rem;padding:12px;text-align:center;font-weight:600;line-height:1.3}
  .card-body{padding:0 2px}
  .card-title{
    font-size:.95rem;font-weight:600;margin:0 0 2px;color:#fff;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
    line-height:1.3;letter-spacing:-.01em;
  }
  .card-artist{font-size:.82rem;color:var(--ink-soft);margin:0 0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .card-year{font-size:.74rem;color:var(--ink-mute);font-variant-numeric:tabular-nums}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-mute)}
  .empty b{display:block;font-size:1.05rem;color:#fff;margin-bottom:6px;font-weight:600}

  .modal{
    position:fixed;inset:0;z-index:200;display:none;
    background:rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    align-items:flex-end;justify-content:center;
  }
  @media (min-width:768px){.modal{align-items:center;padding:24px}}
  .modal.open{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .sheet{
    background:var(--bg-elev);width:100%;max-height:96vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    border-radius:18px 18px 0 0;
    animation:slideUp .35s cubic-bezier(.16,1,.3,1);
    position:relative;padding-bottom:max(20px,var(--safe-bot));
  }
  @media (min-width:768px){.sheet{max-width:560px;border-radius:20px;max-height:90vh}}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* Auto-play banner */
  .autoplay-banner{
    display:none;position:sticky;top:0;z-index:6;
    padding:8px 16px;
    background:linear-gradient(90deg,var(--accent),var(--accent-soft));
    color:#fff;
    font-size:.8rem;font-weight:700;
    text-align:center;
    letter-spacing:-.01em;
  }
  .autoplay-banner.show{display:block}
  .autoplay-banner b{font-weight:800;font-variant-numeric:tabular-nums}
  .autoplay-banner button{
    margin-left:10px;
    background:rgba(0,0,0,.25);border:none;
    color:#fff;font-family:inherit;font-size:.75rem;font-weight:700;
    padding:4px 10px;border-radius:999px;cursor:pointer;
    -webkit-appearance:none;
  }

  .sheet-hero{position:relative;padding:10px 20px 22px;text-align:center;overflow:hidden}
  .sheet-hero-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.5);opacity:.6;z-index:0}
  .sheet-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,28,30,.25) 0%,rgba(28,28,30,.92) 100%);z-index:1}
  .sheet-handle{display:block;width:36px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin:8px auto 14px;position:relative;z-index:2}
  @media (min-width:768px){.sheet-handle{display:none}}
  .sheet-topbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet-counter{font-size:.8rem;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .sheet-counter b{color:var(--accent);font-weight:700}
  .sheet-close{
    display:inline-flex;align-items:center;gap:5px;
    padding:8px 13px;background:rgba(255,255,255,.14);
    border:none;border-radius:999px;color:#fff;
    font-family:inherit;font-size:.88rem;font-weight:600;
    cursor:pointer;min-height:36px;-webkit-appearance:none;
  }
  .sheet-close:hover{background:rgba(255,255,255,.22)}
  .sheet-hero-content{position:relative;z-index:3}
  .sheet-thumb{
    width:min(58vw,220px);aspect-ratio:1;margin:0 auto 18px;
    border-radius:12px;overflow:hidden;
    background:linear-gradient(135deg,var(--bg-elev-2),var(--bg-elev));
    box-shadow:0 16px 40px rgba(0,0,0,.6);
  }
  .sheet-thumb img{width:100%;height:100%;object-fit:cover}
  .sheet-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1rem;padding:18px;text-align:center;line-height:1.3}
  .sheet-title{font-size:clamp(1.3rem,5.5vw,1.55rem);font-weight:800;margin:0 0 4px;letter-spacing:-.02em;line-height:1.2;color:#fff}
  .sheet-artist{color:var(--accent-soft);font-size:1rem;margin:0 0 10px;font-weight:500}
  .sheet-meta{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:500}
  .sheet-meta .dot{width:3px;height:3px;background:var(--ink-mute);border-radius:50%}

  .sheet-body{padding:6px 20px 0;position:relative;z-index:3;background:var(--bg-elev)}
  .summary{
    font-size:1rem;line-height:1.6;color:#fff;margin:0 0 14px;
    padding:14px 16px;background:var(--bg-elev-2);
    border-radius:12px;border-left:3px solid var(--accent);font-weight:400;
  }

  .more-btn{
    display:flex;width:100%;align-items:center;justify-content:center;gap:6px;
    padding:13px 16px;background:var(--bg-elev-2);border:none;border-radius:10px;
    color:var(--accent-soft);font-family:inherit;font-size:.95rem;font-weight:600;
    cursor:pointer;min-height:46px;margin-bottom:10px;-webkit-appearance:none;
  }

  .story{max-height:0;overflow:hidden;transition:max-height .5s ease,opacity .3s ease,margin .3s ease;opacity:0;margin:0}
  .story.open{max-height:3000px;opacity:1;margin:0 0 14px}
  .story-inner{padding:12px 2px}
  .story p{margin:0 0 14px;font-size:.96rem;line-height:1.8;color:var(--ink-soft)}
  .story p:last-child{margin-bottom:0}

  .yt-section{margin:18px 0 14px}
  .yt-label{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-mute);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
  .yt-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
  .yt-wrap iframe, .yt-wrap > div{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt-pending{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--bg-elev-2);color:var(--ink-soft);flex-direction:column;gap:8px;text-align:center;padding:20px}
  .yt-pending svg{width:34px;height:34px;color:var(--accent);opacity:.7}
  .yt-pending span{font-weight:700;color:#fff;font-size:.9rem}
  .yt-pending small{font-size:.78rem;color:var(--ink-mute)}

  .sheet-actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .btn{
    width:100%;padding:13px 18px;border:none;border-radius:12px;
    font-family:inherit;font-size:.98rem;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    text-decoration:none;min-height:48px;-webkit-appearance:none;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(252,60,68,.3)}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-ghost{background:var(--bg-elev-2);color:#fff}
  .btn-ghost:hover{background:var(--bg-elev-3)}

  .sheet-nav{display:flex;gap:8px;margin-top:12px;padding-top:14px;border-top:.5px solid var(--line)}
  .nav-btn{
    flex:1;padding:12px;background:var(--bg-elev-2);border:none;border-radius:10px;
    font-family:inherit;font-size:.9rem;font-weight:600;color:#fff;cursor:pointer;
    min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;
    -webkit-appearance:none;
  }
  .nav-btn:disabled{opacity:.35;cursor:not-allowed}

  footer{text-align:center;padding:32px 20px 44px;color:var(--ink-mute);font-size:.78rem;border-top:.5px solid var(--line);margin-top:16px}
  footer .heart{color:var(--accent)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg"><div class="hero-bg-grid" id="heroBgGrid"></div></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-eyebrow">Old Pop Diary</span>
      <h1>최영숙의 올드팝 다이어리</h1>
      <p class="hero-tagline">최영숙님이 손수 선별하신 인생의 올드팝 188곡</p>
      <div class="hero-stats">
        <b id="totalCount">188</b><span>곡</span>
        <span class="dot"></span>
        <b>52</b><span>장의 손글씨 메모</span>
      </div>
      <div class="hero-actions">
        <button class="hero-btn hero-btn-primary" id="playAllBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          전체 듣기
        </button>
        <button class="hero-btn hero-btn-ghost" id="shuffleBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          셔플 재생
        </button>
      </div>
    </div>
  </section>

  <div class="guide">
    <h3 class="guide-title">♪ 이렇게 사용하세요</h3>
    <ol class="guide-steps">
      <li><span class="step-num">1</span><span><b>전체 듣기</b> 또는 <b>셔플 재생</b>으로 자동 재생을 시작하세요</span></li>
      <li><span class="step-num">2</span><span>한 곡씩 보고 싶으면 <b>앨범 그림을 누르세요</b></span></li>
      <li><span class="step-num">3</span><span>노래 이야기를 읽고 <b>카톡으로 공유</b>해 보세요</span></li>
    </ol>
  </div>

  <div class="toolbar">
    <div class="toolbar-inner wrap" style="padding:0">
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="q" placeholder="노래 제목·가수 검색" autocomplete="off" inputmode="search">
      </div>
      <div class="chips" id="chips">
        <button class="chip active" data-era="all">전체</button>
        <button class="chip" data-era="1960">1960년대</button>
        <button class="chip" data-era="1970">1970년대</button>
        <button class="chip" data-era="1980">1980년대</button>
        <button class="chip" data-era="1990">1990년대 이후</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="count-row"><div class="count"><b id="count">188</b>곡 표시 중</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <footer><span class="heart">♪</span> 사랑하는 가족과 친구들을 위하여 <span class="heart">♪</span></footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="autoplay-banner" id="autoplayBanner">
        <span id="autoplayLabel">▶ 연속 재생</span> · <b id="autoplayProgress">1/146</b>
        <button id="autoplayStopBtn">자동재생 끄기</button>
      </div>
      <div class="sheet-hero">
        <div class="sheet-hero-bg" id="sBg"></div>
        <div class="sheet-hero-overlay"></div>
        <span class="sheet-handle"></span>
        <div class="sheet-hero-content">
          <div class="sheet-topbar">
            <span class="sheet-counter"><b id="sNum">1</b>번째 곡</span>
            <button class="sheet-close" id="closeBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              닫기
            </button>
          </div>
          <div class="sheet-thumb" id="sThumb"></div>
          <h2 class="sheet-title" id="sTitle"></h2>
          <p class="sheet-artist" id="sArtist"></p>
          <div class="sheet-meta" id="sMeta"></div>
        </div>
      </div>

const THUMB_BASE = "thumbnails/";

const esc = t => String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function thumbURL(s){
  if(s.thumb) return THUMB_BASE + s.thumb;
  if(s.ytid) return `https://i.ytimg.com/vi/${s.ytid}/mqdefault.jpg`;
  return null;
}

function thumbHTML(s){
  const url = thumbURL(s);
  if(url){
    return `<img src="${url}" alt="${esc(s.title)}" loading="lazy" onerror="ytFallback(this, '${s.ytid||''}', '${esc(s.title).replace(/'/g,"\\&#39;")}')">`;
  }
  return `<div class="ph">${esc(s.title)}</div>`;
}
function ytFallback(img, ytid, title){
  if(ytid && !img.src.includes('ytimg.com')){
    img.onerror = function(){ img.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:title})); };
    img.src = 'https://i.ytimg.com/vi/'+ytid+'/mqdefault.jpg';
  } else {
    img.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:title}));
  }
}

function cardHTML(s){
  return `
    <button class="card" data-no="${s.no}" aria-label="${esc(s.title)} - ${esc(s.artist)}">
      <div class="card-thumb">${thumbHTML(s)}</div>
      <div class="card-body">
        <h3 class="card-title">${esc(s.title)}</h3>
        <p class="card-artist">${esc(s.artist)}</p>
        ${s.year ? `<div class="card-year">${s.year}</div>` : ""}
      </div>
    </button>`;
}

const grid = document.getElementById("grid");
const qInput = document.getElementById("q");
const countEl = document.getElementById("count");
let currentFilter = {era:"all", q:""};
let currentList = SONGS;

function applyFilter(){
  let list = SONGS;
  if(currentFilter.era !== "all"){
    const era = parseInt(currentFilter.era);
    list = list.filter(s => {
      if(!s.year) return false;
      const y = parseInt(s.year);
      if(currentFilter.era === "1990") return y >= 1990;
      return y >= era && y < era + 10;
    });
  }
  if(currentFilter.q){
    const k = currentFilter.q.toLowerCase();
    list = list.filter(s =>
      s.title.toLowerCase().includes(k) ||
      s.artist.toLowerCase().includes(k) ||
      (s.year && String(s.year).includes(k))
    );
  }
  currentList = list;
  if(list.length === 0){
    grid.innerHTML = '<div class="empty"><b>찾는 노래가 없어요</b><span>다른 단어로 검색해 보세요</span></div>';
  } else {
    grid.innerHTML = list.map(cardHTML).join("");
  }
  countEl.textContent = list.length;
}

qInput.addEventListener("input", e => { currentFilter.q = e.target.value.trim(); applyFilter(); });
document.getElementById("chips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  currentFilter.era = chip.dataset.era;
  applyFilter();
});

applyFilter();

// ============ MODAL & AUTOPLAY QUEUE ============
const modal = document.getElementById("modal");
const sNum = document.getElementById("sNum");
const sBg = document.getElementById("sBg");
const sThumb = document.getElementById("sThumb");
const sTitle = document.getElementById("sTitle");
const sArtist = document.getElementById("sArtist");
const sMeta = document.getElementById("sMeta");
const sSummary = document.getElementById("sSummary");
const sStory = document.getElementById("sStory");
const moreBtn = document.getElementById("moreBtn");
const moreText = document.getElementById("moreText");
const ytLink = document.getElementById("ytLink");
const ytWrap = document.getElementById("ytWrap");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const autoplayBanner = document.getElementById("autoplayBanner");
const autoplayLabel = document.getElementById("autoplayLabel");
const autoplayProgress = document.getElementById("autoplayProgress");
const autoplayStopBtn = document.getElementById("autoplayStopBtn");

let currentNo = null;
let ytPlayer = null;
let ytApiReady = false;
let autoplayQueue = null;   // array of song objects, or null
let autoplayIdx = 0;
let autoplayMode = null;    // 'all' | 'shuffle' | null

function onYouTubeIframeAPIReady(){ ytApiReady = true; }
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function destroyPlayer(){
  if(ytPlayer){
    try{ ytPlayer.destroy(); }catch(_){}
    ytPlayer = null;
  }
}

function renderEmbed(s, autoplay){
  ytWrap.innerHTML = '';
  if(!s.ytid){
    ytWrap.innerHTML = `<div class="yt-pending">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/></svg>
      <span>영상 준비 중입니다</span>
      <small>아래 빨간 버튼을 누르면 유튜브에서 들으실 수 있어요</small>
    </div>`;
    return;
  }
  // YT IFrame Player API to track ENDED
  destroyPlayer();
  const playerDiv = document.createElement('div');
  playerDiv.id = 'ytplayer';
  ytWrap.appendChild(playerDiv);
  const create = () => {
    ytPlayer = new YT.Player('ytplayer', {
      videoId: s.ytid,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        autoplay: autoplay ? 1 : 0,
        playsinline: 1,
        rel: 0,
        modestbranding: 1,
      },
      events: {
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.ENDED && autoplayMode && autoplayQueue){
            playNextInQueue();
          }
        }
      }
    });
  };
  if(ytApiReady && window.YT && window.YT.Player){
    create();
  } else {
    const wait = setInterval(() => {
      if(window.YT && window.YT.Player){
        clearInterval(wait);
        create();
      }
    }, 100);
  }
}

function updateAutoplayBanner(){
  if(autoplayMode && autoplayQueue){
    autoplayBanner.classList.add('show');
    autoplayLabel.textContent = autoplayMode === 'shuffle' ? '🔀 셔플 재생 중' : '▶ 전체 듣기 중';
    autoplayProgress.textContent = `${autoplayIdx + 1}/${autoplayQueue.length}`;
  } else {
    autoplayBanner.classList.remove('show');
  }
}

function stopAutoplay(){
  autoplayMode = null;
  autoplayQueue = null;
  autoplayIdx = 0;
  updateAutoplayBanner();
}
autoplayStopBtn.addEventListener('click', stopAutoplay);

function playNextInQueue(){
  if(!autoplayQueue) return;
  autoplayIdx++;
  if(autoplayIdx >= autoplayQueue.length){
    stopAutoplay();
    return;
  }
  openModal(autoplayQueue[autoplayIdx].no, {fromAutoplay: true});
}

function openModal(no, opts = {}){
  const s = SONGS.find(x => x.no === no);
  if(!s) return;
  currentNo = no;
  const story = STORIES[String(s.no)] || {summary:"", paragraphs:[]};

  sNum.textContent = s.no;
  const tUrl = thumbURL(s);
  sBg.style.backgroundImage = tUrl ? `url("${tUrl}")` : 'none';
  sThumb.innerHTML = thumbHTML(s);
  sTitle.textContent = s.title;
  sArtist.textContent = s.artist;

  const metaParts = [];
  if(s.year) metaParts.push(String(s.year));
  if(s.album) metaParts.push(s.album);
  sMeta.innerHTML = metaParts.length ? metaParts.map((p,i)=>(i>0?'<span class="dot"></span>':'')+esc(p)).join('') : '';
  sMeta.style.display = metaParts.length ? '' : 'none';

  sSummary.textContent = story.summary || `${s.artist}의 곡.`;

  if(story.paragraphs && story.paragraphs.length){
    sStory.innerHTML = `<div class="story-inner">${story.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
    moreBtn.style.display = "flex";
  } else {
    sStory.innerHTML = "";
    moreBtn.style.display = "none";
  }
  sStory.classList.remove("open");
  moreText.textContent = "▼ 노래 이야기 더 자세히 보기";

  const query = encodeURIComponent(`${s.title} ${s.artist}`);
  ytLink.href = s.ytid ? `https://www.youtube.com/watch?v=${s.ytid}` : `https://www.youtube.com/results?search_query=${query}`;

  // 자동재생: autoplay 모드면 항상 autoplay, 일반 오픈이면 false
  const shouldAutoplay = !!opts.fromAutoplay || !!opts.autoplay;
  renderEmbed(s, shouldAutoplay);

  // Prev/Next: 자동큐 모드면 큐 순서, 아니면 currentList 순서
  if(autoplayMode && autoplayQueue){
    prevBtn.disabled = autoplayIdx <= 0;
    nextBtn.disabled = autoplayIdx >= autoplayQueue.length - 1;
  } else {
    const idx = currentList.findIndex(x => x.no === no);
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx < 0 || idx >= currentList.length - 1;
  }

  updateAutoplayBanner();
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  // scroll to top of sheet
  const sheet = document.querySelector('.sheet');
  if(sheet) sheet.scrollTop = 0;
}

function closeModal(){
  modal.classList.remove("open");
  document.body.style.overflow = "";
  destroyPlayer();
  ytWrap.innerHTML = "";
  stopAutoplay();
  currentNo = null;
}

grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if(card){
    stopAutoplay();
    openModal(Number(card.dataset.no));
  }
});
document.getElementById("closeBtn").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
  if(!modal.classList.contains("open")) return;
  if(e.key === "Escape") closeModal();
  if(e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  if(e.key === "ArrowRight" && !nextBtn.disabled) nextBtn.click();
});

moreBtn.addEventListener("click", () => {
  const open = sStory.classList.toggle("open");
  moreText.textContent = open ? "▲ 접기" : "▼ 노래 이야기 더 자세히 보기";
});

prevBtn.addEventListener("click", () => {
  if(autoplayMode && autoplayQueue){
    if(autoplayIdx > 0){
      autoplayIdx--;
      openModal(autoplayQueue[autoplayIdx].no, {fromAutoplay: true});
    }
    return;
  }
  const idx = currentList.findIndex(x => x.no === currentNo);
  if(idx > 0) openModal(currentList[idx - 1].no);
});
nextBtn.addEventListener("click", () => {
  if(autoplayMode && autoplayQueue){
    playNextInQueue();
    return;
  }
  const idx = currentList.findIndex(x => x.no === currentNo);
  if(idx >= 0 && idx < currentList.length - 1) openModal(currentList[idx + 1].no);
});

  const a = sArtist.textContent;
  const txt = `${t} — ${a}\n(최영숙의 올드팝 다이어리 中)`;
  if(navigator.share){
    try{ await navigator.share({title:"최영숙의 올드팝 다이어리", text: txt, url: location.href}); }catch(_){}
  } else {
    try{
      await navigator.clipboard.writeText(`${txt}\n${location.href}`);
      const b = document.getElementById("shareBtn");
      const orig = b.innerHTML;
      b.innerHTML = "✓ 복사되었어요!";
      setTimeout(()=>{b.innerHTML = orig}, 1800);
    }catch(_){}
  }
});

// ============ PLAY ALL / SHUFFLE ============
function startQueue(mode){
  const playable = currentList.filter(s => s.ytid);
  if(playable.length === 0){
    alert("재생 가능한 곡이 없습니다.");
    return;
  }
  autoplayMode = mode;
  autoplayQueue = mode === 'shuffle'
    ? playable.slice().sort(() => Math.random() - 0.5)
    : playable.slice();
  autoplayIdx = 0;
  openModal(autoplayQueue[0].no, {fromAutoplay: true});
}

document.getElementById("playAllBtn").addEventListener("click", () => startQueue('all'));
document.getElementById("shuffleBtn").addEventListener("click", () => startQueue('shuffle'));
</script>
