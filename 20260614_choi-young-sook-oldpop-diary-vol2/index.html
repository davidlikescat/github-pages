<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>최영숙의 올드팝 다이어리 · 2집</title>
<meta property="og:title" content="최영숙의 올드팝 다이어리 · 2집">
<meta property="og:description" content="최영숙님이 손수 적어 내려간 올드팝 두 번째 수첩, 42곡.">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#fbfbfd;
    --surface:#f5f5f7;
    --surface-2:#ececee;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#86868b;
    --line:rgba(0,0,0,.09);
    --accent:#0071e3;
    --accent-press:#0060c0;
    --radius:18px;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px;-webkit-text-size-adjust:100%}
  @media (min-width:768px){html{font-size:17px}}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    line-height:1.47;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    padding-bottom:var(--safe-bot);overflow-x:hidden;letter-spacing:-.01em;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  @media (min-width:768px){.wrap{padding:0 32px}}

  /* ---------- Hero ---------- */
  .hero{padding:calc(var(--safe-top) + 76px) 22px 30px;text-align:center;max-width:720px;margin:0 auto}
  @media (min-width:768px){.hero{padding-top:calc(var(--safe-top) + 110px);padding-bottom:42px}}
  .eyebrow{
    font-size:.78rem;font-weight:600;letter-spacing:.02em;color:var(--accent);
    text-transform:none;margin:0 0 14px;
  }
  .hero h1{
    font-size:clamp(2.1rem,8vw,3.6rem);font-weight:700;letter-spacing:-.025em;
    line-height:1.06;margin:0 0 18px;color:var(--ink);
  }
  .hero p.lede{
    font-size:clamp(1.02rem,3.4vw,1.32rem);font-weight:400;color:var(--ink-2);
    margin:0 auto 26px;max-width:540px;line-height:1.5;
  }
  .hero-meta{
    display:inline-flex;align-items:center;gap:9px;
    font-size:.86rem;color:var(--ink-3);font-variant-numeric:tabular-nums;
    margin-bottom:28px;
  }
  .hero-meta b{color:var(--ink);font-weight:600}
  .hero-meta .dot{width:3px;height:3px;background:var(--ink-3);border-radius:50%;opacity:.6}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{
    appearance:none;border:none;cursor:pointer;font-family:inherit;
    font-size:1rem;font-weight:500;letter-spacing:-.01em;
    padding:12px 26px;border-radius:980px;min-height:48px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease,background .18s ease,color .18s ease,border-color .18s ease;
    text-decoration:none;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-press)}
  .btn-secondary{background:var(--surface);color:var(--ink)}
  .btn-secondary:hover{background:var(--surface-2)}

  /* ---------- Toolbar ---------- */
  .toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.8);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);padding:13px 0;margin-top:14px}
  .search{position:relative;max-width:1040px;margin:0 auto;padding:0 22px}
  @media (min-width:768px){.search{padding:0 32px}}
  .search input{
    width:100%;padding:12px 16px 12px 42px;border:none;border-radius:12px;
    background:var(--surface);color:var(--ink);font-family:inherit;font-size:1rem;
    outline:none;min-height:46px;appearance:none;transition:box-shadow .15s ease,background .15s ease;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.16),inset 0 0 0 1px var(--line)}
  .search svg{position:absolute;left:34px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
  @media (min-width:768px){.search svg{left:44px}}

  /* ---------- Grid ---------- */
  .count{padding:26px 0 14px;font-size:.86rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .count b{color:var(--ink);font-weight:600}
  .grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px;padding:0 0 110px;
  }
  @media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 22px}}
  @media (min-width:1100px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

  .card{
    appearance:none;border:none;background:none;padding:0;cursor:pointer;text-align:left;
    font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:11px;min-width:0;
  }
  .art{
    position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;
    background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
    transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s ease;
  }
  .card:hover .art{transform:translateY(-4px);box-shadow:0 2px 6px rgba(0,0,0,.08),0 16px 36px rgba(0,0,0,.13)}
  .card:active .art{transform:scale(.98)}
  .art img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
  .art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:14px;text-align:center;font-size:.82rem;font-weight:600;color:var(--ink-2);line-height:1.3}
  .art .play{
    position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.22);opacity:0;transform:translateY(6px) scale(.9);
    transition:opacity .2s ease,transform .2s ease;
  }
  .card:hover .play{opacity:1;transform:translateY(0) scale(1)}
  .meta{padding:0 2px;min-width:0}
  .t{font-size:.96rem;font-weight:600;color:var(--ink);margin:0 0 2px;letter-spacing:-.012em;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;line-height:1.32}
  .a{font-size:.86rem;color:var(--ink-2);margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-3)}
  .empty b{display:block;color:var(--ink);font-size:1.1rem;font-weight:600;margin-bottom:6px}

  footer{border-top:.5px solid var(--line);padding:30px 22px 46px;text-align:center;color:var(--ink-3);font-size:.8rem}
  footer .h{color:var(--accent)}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;z-index:200;display:none;background:rgba(0,0,0,.32);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);align-items:flex-end;justify-content:center}
  @media (min-width:768px){.modal{align-items:center;padding:28px}}
  .modal.open{display:flex;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    background:var(--bg);width:100%;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;border-radius:22px 22px 0 0;position:relative;
    padding-bottom:max(22px,var(--safe-bot));animation:rise .36s cubic-bezier(.16,1,.3,1);
    box-shadow:0 -10px 60px rgba(0,0,0,.18);
  }
  @media (min-width:768px){.sheet{max-width:560px;border-radius:22px;max-height:90vh;box-shadow:0 30px 90px rgba(0,0,0,.28)}}
  @keyframes rise{from{transform:translateY(46px);opacity:0}to{transform:translateY(0);opacity:1}}

  .banner{display:none;position:sticky;top:0;z-index:6;padding:9px 18px;
    background:var(--accent);color:#fff;font-size:.82rem;font-weight:600;text-align:center;
    border-radius:22px 22px 0 0}
  @media (min-width:768px){.banner{border-radius:22px 22px 0 0}}
  .banner.show{display:block}
  .banner b{font-weight:700;font-variant-numeric:tabular-nums}
  .banner button{margin-left:10px;background:rgba(255,255,255,.22);border:none;color:#fff;
    font-family:inherit;font-size:.74rem;font-weight:600;padding:4px 11px;border-radius:980px;cursor:pointer}

  .sheet-top{position:relative;padding:8px 20px 0}
  .handle{display:block;width:38px;height:5px;border-radius:3px;background:var(--surface-2);margin:8px auto 0}
  @media (min-width:768px){.handle{display:none}}
  .sheet-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px}
  .sheet-counter{font-size:.82rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .sheet-counter b{color:var(--accent);font-weight:600}
  .x{appearance:none;border:none;background:var(--surface);color:var(--ink);width:34px;height:34px;
    border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .x:hover{background:var(--surface-2)}

  .sheet-body{padding:6px 20px 0}
  .player{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin:8px 0 18px}
  .player iframe,.player > div{position:absolute;inset:0;width:100%;height:100%;border:0}
  .player .pending{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    width:100%;height:100%;background:var(--surface);color:var(--ink-2);text-align:center;padding:20px}
  .player .pending b{color:var(--ink);font-size:.95rem}
  .player .pending small{font-size:.78rem;color:var(--ink-3)}

  .s-title{font-size:clamp(1.4rem,5vw,1.7rem);font-weight:700;letter-spacing:-.022em;line-height:1.18;margin:0 0 5px}
  .s-artist{font-size:1.02rem;color:var(--ink-2);margin:0 0 18px}

  .sheet-actions{display:flex;flex-direction:column;gap:10px}
  .sheet-actions .btn{width:100%}
  .nav{display:flex;gap:10px;margin-top:14px;padding-top:16px;border-top:.5px solid var(--line)}
  .nav button{flex:1;appearance:none;border:none;background:var(--surface);color:var(--ink);
    font-family:inherit;font-size:.92rem;font-weight:500;padding:13px;border-radius:12px;cursor:pointer;
    min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
  .nav button:hover{background:var(--surface-2)}
  .nav button:disabled{opacity:.4;cursor:not-allowed}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Old Pop Diary · Volume 2</p>
    <h1>최영숙의 올드팝 다이어리<br>두 번째 수첩</h1>
    <p class="lede">스프링 수첩 한 장 한 장에 손수 적어 내려간 두 번째 올드팝 묶음. 42곡을 가만히 따라 들어보세요.</p>
    <div class="hero-meta">
      <span><b>42</b>곡</span><span class="dot"></span>
      <span><b>11</b>장의 손글씨</span><span class="dot"></span>
      <span>1960s–1990s</span>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="playAll">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        전체 재생
      </button>
      <button class="btn btn-secondary" id="shuffle">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        셔플
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="q" placeholder="제목·가수 검색" autocomplete="off" inputmode="search">
    </div>
  </div>

  <main class="wrap">
    <div class="count"><b id="count">42</b>곡</div>
    <div class="grid" id="grid"></div>
  </main>

  <footer><span class="h">♪</span>&nbsp; 사랑하는 가족과 친구들을 위하여 &nbsp;<span class="h">♪</span></footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="banner" id="banner">
        <span id="bannerLabel">▶ 연속 재생</span> · <b id="bannerProg">1/42</b>
        <button id="bannerStop">자동재생 끄기</button>
      </div>
      <div class="sheet-top">
        <span class="handle"></span>
        <div class="sheet-bar">
          <span class="sheet-counter"><b id="sNum">1</b> / 42</span>
          <button class="x" id="closeBtn" aria-label="닫기">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body">
        <div class="player" id="player"></div>
        <h2 class="s-title" id="sTitle"></h2>
        <p class="s-artist" id="sArtist"></p>
        <div class="sheet-actions">
          <a class="btn btn-primary" id="ytLink" href="#" target="_blank" rel="noopener">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            유튜브에서 보기
          </a>
          <button class="btn btn-secondary" id="shareBtn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            공유하기
          </button>
        </div>
        <div class="nav">
          <button id="prevBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>이전</button>
          <button id="nextBtn">다음<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </div>
    </div>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const SONGS = [{"no":1,"title":"Listen to My Heart","artist":"Gareth Gates","ytid":"MsyJHwGN7js"},{"no":2,"title":"Living Next Door to Alice","artist":"Smokie","ytid":"Z6qnRS36EgE"},{"no":3,"title":"Honey","artist":"Bobby Goldsboro","ytid":"UKAeeGnAYBo"},{"no":4,"title":"Queen of Hearts","artist":"Juice Newton","ytid":"P0DK-0fIKCw"},{"no":5,"title":"Lean on Me","artist":"Michael Bolton","ytid":"53JD-KBgKSE"},{"no":6,"title":"When a Man Loves a Woman","artist":"Michael Bolton","ytid":"MUuNDb-nm5M"},{"no":7,"title":"Shape of My Heart","artist":"Sting","ytid":"NlwIDxCjL-8"},{"no":8,"title":"Hopelessly Devoted to You","artist":"Olivia Newton-John","ytid":"r-3NvDp28U4"},{"no":9,"title":"When I Dream","artist":"Lynn Anderson","ytid":"h1x00eL6Qks"},{"no":10,"title":"Banks of the Ohio","artist":"Olivia Newton-John","ytid":"-LT5ZJGj5QA"},{"no":11,"title":"25 Minutes","artist":"Michael Learns to Rock","ytid":"SIWcOdBtLRw"},{"no":12,"title":"Tonight I Celebrate My Love","artist":"Peabo Bryson & Roberta Flack","ytid":"4t0Xo3-Ga_4"},{"no":13,"title":"Four Strong Winds","artist":"Neil Young","ytid":"Cz1SuUCutxM"},{"no":14,"title":"Don't Forget to Remember","artist":"Bee Gees","ytid":"FIdewXHh3eQ"},{"no":15,"title":"Love Hurts","artist":"Nazareth","ytid":"Vj2AlaQcW40"},{"no":16,"title":"You've Got a Friend","artist":"James Taylor","ytid":"nKaWQxlTsRM"},{"no":17,"title":"Just the Way You Are","artist":"Billy Joel","ytid":"HaA3YZ6QdJU"},{"no":18,"title":"Blowin' in the Wind","artist":"Peter, Paul & Mary","ytid":"Ld6fAO4idaI"},{"no":19,"title":"Take My Breath Away","artist":"Berlin","ytid":"Bx51eegLTY8"},{"no":20,"title":"Now and Forever","artist":"Richard Marx","ytid":"OeDiK2uy3DU"},{"no":21,"title":"When I Fall in Love","artist":"Natalie Cole & Nat King Cole","ytid":"vo6D_tp3DeE"},{"no":22,"title":"I'd Love You to Want Me","artist":"Lobo","ytid":"tqp_wbYLsYQ"},{"no":23,"title":"The Letter","artist":"The Box Tops","ytid":"pyq3PUTnpd0"},{"no":24,"title":"Sing","artist":"Carpenters","ytid":"2LYekeK0HWo"},{"no":25,"title":"Daniel","artist":"Elton John","ytid":"-9xib-hCm6c"},{"no":26,"title":"(Everything I Do) I Do It for You","artist":"Bryan Adams","ytid":"Y0pdQU87dc8"},{"no":27,"title":"New Kid in Town","artist":"Eagles","ytid":"_fW2rw8SwoA"},{"no":28,"title":"Don't Go Breaking My Heart","artist":"Elton John & Kiki Dee","ytid":"z0qW9P-uYfM"},{"no":29,"title":"Green Green Grass of Home","artist":"Tom Jones","ytid":"EmT1ptv3VEc"},{"no":30,"title":"And I Love You So","artist":"Perry Como","ytid":"SKp1HKM_4TY"},{"no":31,"title":"I'm in Love with You","artist":"Steve Forbert","ytid":"7swvEk8w7Xw"},{"no":32,"title":"I've Been Away Too Long","artist":"George Baker Selection","ytid":"TfvAStsJBEM"},{"no":33,"title":"Reflections of My Life","artist":"The Marmalade","ytid":"xw9o_4KLREA"},{"no":34,"title":"I'll Be There","artist":"The Jackson 5","ytid":"W-apaIOOoAo"},{"no":35,"title":"One More Time","artist":"Richard Marx","ytid":"a8sVOAqi0fQ"},{"no":36,"title":"Annie's Song","artist":"John Denver","ytid":"RNOTF-znQyw"},{"no":37,"title":"Song Sung Blue","artist":"Neil Diamond","ytid":"lSy9dt5FeS0"},{"no":38,"title":"Rose Garden","artist":"Lynn Anderson","ytid":"KXHsWBKKNbI"},{"no":39,"title":"Total Eclipse of the Heart","artist":"Bonnie Tyler","ytid":"lcOxhH8N3Bo"},{"no":40,"title":"Venus","artist":"Bananarama","ytid":"d4-1ASpdT1Y"},{"no":41,"title":"Daddy Cool","artist":"Boney M.","ytid":"FYGTT7YhywA"},{"no":42,"title":"Ballade pour Adeline","artist":"Richard Clayderman","ytid":"qr9ZdA_WRjc"}];

const esc = t => String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const thumbURL = s => s.ytid ? `https://i.ytimg.com/vi/${s.ytid}/mqdefault.jpg` : null;

function artHTML(s){
  const url = thumbURL(s);
  const play = `<span class="play"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>`;
  if(url) return `<img src="${url}" alt="${esc(s.title)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc(s.title).replace(/'/g,"\\&#39;")}'}))">${play}`;
  return `<div class="ph">${esc(s.title)}</div>${play}`;
}
function cardHTML(s){
  return `<button class="card" data-no="${s.no}" aria-label="${esc(s.title)} - ${esc(s.artist)}">
    <div class="art">${artHTML(s)}</div>
    <div class="meta"><h3 class="t">${esc(s.title)}</h3><p class="a">${esc(s.artist)}</p></div>
  </button>`;
}

const grid = document.getElementById("grid");
const qInput = document.getElementById("q");
const countEl = document.getElementById("count");
let currentList = SONGS;

function applyFilter(){
  const k = qInput.value.trim().toLowerCase();
  let list = SONGS;
  if(k) list = SONGS.filter(s => s.title.toLowerCase().includes(k) || s.artist.toLowerCase().includes(k));
  currentList = list;
  grid.innerHTML = list.length
    ? list.map(cardHTML).join("")
    : '<div class="empty"><b>찾는 노래가 없어요</b><span>다른 단어로 검색해 보세요</span></div>';
  countEl.textContent = list.length;
}
qInput.addEventListener("input", applyFilter);
applyFilter();

// ---------- Modal & Autoplay ----------
const modal = document.getElementById("modal");
const sNum = document.getElementById("sNum");
const sTitle = document.getElementById("sTitle");
const sArtist = document.getElementById("sArtist");
const player = document.getElementById("player");
const ytLink = document.getElementById("ytLink");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const banner = document.getElementById("banner");
const bannerLabel = document.getElementById("bannerLabel");
const bannerProg = document.getElementById("bannerProg");
const bannerStop = document.getElementById("bannerStop");

let currentNo = null, ytPlayer = null, ytReady = false;
let queue = null, qIdx = 0, qMode = null;

window.onYouTubeIframeAPIReady = () => { ytReady = true; };

function destroyPlayer(){ if(ytPlayer){ try{ytPlayer.destroy();}catch(_){ } ytPlayer=null; } }

function renderEmbed(s, autoplay){
  player.innerHTML = "";
  if(!s.ytid){
    player.innerHTML = `<div class="pending"><b>영상 준비 중입니다</b><small>아래 버튼으로 유튜브에서 들으실 수 있어요</small></div>`;
    return;
  }
  destroyPlayer();
  const d = document.createElement("div"); d.id = "ytp"; player.appendChild(d);
  const create = () => {
    ytPlayer = new YT.Player("ytp",{
      videoId:s.ytid, host:"https://www.youtube-nocookie.com",
      playerVars:{autoplay:autoplay?1:0,playsinline:1,rel:0,modestbranding:1},
      events:{onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED && qMode && queue) playNext(); }}
    });
  };
  if(ytReady && window.YT && window.YT.Player) create();
  else { const w=setInterval(()=>{ if(window.YT&&window.YT.Player){clearInterval(w);create();} },100); }
}

function updateBanner(){
  if(qMode && queue){
    banner.classList.add("show");
    bannerLabel.textContent = qMode==="shuffle" ? "🔀 셔플 재생 중" : "▶ 전체 재생 중";
    bannerProg.textContent = `${qIdx+1}/${queue.length}`;
  } else banner.classList.remove("show");
}
function stopAutoplay(){ qMode=null; queue=null; qIdx=0; updateBanner(); }
bannerStop.addEventListener("click", stopAutoplay);
function playNext(){ if(!queue) return; qIdx++; if(qIdx>=queue.length){stopAutoplay();return;} openModal(queue[qIdx].no,{fromAutoplay:true}); }

function openModal(no, opts={}){
  const s = SONGS.find(x=>x.no===no); if(!s) return;
  currentNo = no;
  sNum.textContent = no;
  sTitle.textContent = s.title;
  sArtist.textContent = s.artist;
  const query = encodeURIComponent(`${s.title} ${s.artist}`);
  ytLink.href = s.ytid ? `https://www.youtube.com/watch?v=${s.ytid}` : `https://www.youtube.com/results?search_query=${query}`;
  renderEmbed(s, !!opts.fromAutoplay || !!opts.autoplay);
  if(qMode && queue){
    prevBtn.disabled = qIdx<=0; nextBtn.disabled = qIdx>=queue.length-1;
  } else {
    const i = currentList.findIndex(x=>x.no===no);
    prevBtn.disabled = i<=0; nextBtn.disabled = i<0 || i>=currentList.length-1;
  }
  updateBanner();
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  const sheet = document.querySelector(".sheet"); if(sheet) sheet.scrollTop = 0;
}
function closeModal(){
  modal.classList.remove("open");
  document.body.style.overflow = "";
  destroyPlayer(); player.innerHTML = ""; stopAutoplay(); currentNo = null;
}

grid.addEventListener("click", e => {
  const c = e.target.closest(".card");
  if(c){ stopAutoplay(); openModal(Number(c.dataset.no)); }
});
document.getElementById("closeBtn").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if(e.target===modal) closeModal(); });
document.addEventListener("keydown", e => {
  if(!modal.classList.contains("open")) return;
  if(e.key==="Escape") closeModal();
  if(e.key==="ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  if(e.key==="ArrowRight" && !nextBtn.disabled) nextBtn.click();
});
prevBtn.addEventListener("click", () => {
  if(qMode && queue){ if(qIdx>0){qIdx--;openModal(queue[qIdx].no,{fromAutoplay:true});} return; }
  const i = currentList.findIndex(x=>x.no===currentNo); if(i>0) openModal(currentList[i-1].no);
});
nextBtn.addEventListener("click", () => {
  if(qMode && queue){ playNext(); return; }
  const i = currentList.findIndex(x=>x.no===currentNo); if(i>=0 && i<currentList.length-1) openModal(currentList[i+1].no);
});

document.getElementById("shareBtn").addEventListener("click", async () => {
  const txt = `${sTitle.textContent} — ${sArtist.textContent}\n(최영숙의 올드팝 다이어리 2집 中)`;
  if(navigator.share){ try{ await navigator.share({title:"최영숙의 올드팝 다이어리 2집",text:txt,url:location.href}); }catch(_){ } }
  else { try{ await navigator.clipboard.writeText(`${txt}\n${location.href}`); const b=document.getElementById("shareBtn"); const o=b.innerHTML; b.innerHTML="✓ 복사되었어요!"; setTimeout(()=>b.innerHTML=o,1700); }catch(_){ } }
});

function startQueue(mode){
  const playable = currentList.filter(s=>s.ytid);
  if(!playable.length){ alert("재생 가능한 곡이 없습니다."); return; }
  qMode = mode;
  queue = mode==="shuffle" ? playable.slice().sort(()=>Math.random()-.5) : playable.slice();
  qIdx = 0;
  openModal(queue[0].no,{fromAutoplay:true});
}
document.getElementById("playAll").addEventListener("click", ()=>startQueue("all"));
document.getElementById("shuffle").addEventListener("click", ()=>startQueue("shuffle"));
</script>
</body>
</html>
